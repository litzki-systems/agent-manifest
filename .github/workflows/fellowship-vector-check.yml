name: Fellowship vector check

on:
  push:
    branches: [fellowship-issuer-authorization]
    paths:
      - ".github/workflows/fellowship-vector-check.yml"

permissions:
  contents: write

jobs:
  regenerate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fellowship-issuer-authorization

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package and dev deps
        working-directory: python
        run: |
          pip install --require-hashes -r ../requirements/dev.txt
          pip install --no-deps -e .

      - name: Regenerate vectors
        working-directory: python
        run: python -m tests.vectors.generate

      - name: Commit regenerated vectors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/tests/vectors
          git commit -m "test: regenerate vectors for AM-VEC-024" || true
          git push origin HEAD:fellowship-issuer-authorization

      - name: Run vector tests
        working-directory: python
        run: pytest -q tests/test_vectors.py -k 'AM-VEC-024 or committed_vectors_match_a_fresh_regeneration'
